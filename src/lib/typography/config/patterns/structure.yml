description: 基本的な文章構造に関するパターン（引用符、段落など）
basePriority: 100
patterns:
  - name: lineWithHeadingQuotes
    description: |
      引用符行を処理(行頭字下げなし、句点があれば削除)
      例: ^　"こんにちは。" → 「こんにちは」
      例: ^　"こんにちは" → 「こんにちは」
      例: ^　'こんにちは。' → 『こんにちは』
      例: ^　'こんにちは' → 『こんにちは』
    pattern:
      source: ^[\\t 　]*(["”'’])(.*?)。?\\1
      flags: "gm"
    transform:
      type: text
      steps:
        - action: processGroup
          group: 2
        - action: replace
          from: (?<!。)。?["”]$
          to: "」"
        - action: replace
          from: (?<!。)。['’]$
          to: 』
        - action: replace
          from: ^[\\t 　]*["”]
          to: "「"
        - action: replace
          from: ^[\\t 　]*['’]
          to: "『"


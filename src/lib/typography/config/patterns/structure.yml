---
description: 基本的な文章構造に関するパターン（引用符、段落など）
basePriority: 500
patterns:
  - name: lineWithHeadingQuotes
    description: |
      引用符行を処理(行頭字下げなし、句点があれば削除)
      例: ^　"こんにちは。" → 「こんにちは」
      例: ^　"こんにちは" → 「こんにちは」
      例: ^　'こんにちは。' → 『こんにちは』
      例: ^　'こんにちは' → 『こんにちは』
    pattern:
      source: ^[\\t 　]*([\"”\'’]).*\\1$
      flags: gm
    transform:
      type: text
      steps:
        - action: replace
          from: (?<!。)。?[\"”]$
          to: "」"
        - action: replace
          from: (?<!。)。[\'’]$
          to: 』
        - action: replace
          from: ^[\\t 　]*[\"”]
          to: "「"
        - action: replace
          from: ^[\\t 　]*[\'’]
          to: "『"

  - name: periodsBeforeClosingBrackets
    description: |
      閉じカギカッコ直前の句点を削除
      例: こんにちは。」 → こんにちは」
      例: さようなら。』 → さようなら』
    pattern:
      source: 。([」』])
    transform:
      type: text
      steps:
        - action: replace
          from: "。([」』])"
          to: "$1"

  - name: lineStartIndent
    description: |
      行頭字下げ
      例: ^こんにちは → 　こんにちは
    pattern:
      source: ^[\\t 　]*
      flags: gm
    transform:
      type: text
      steps:
        - action: replace
          from: ^[\\t 　]*
          to: "　"

  - name: lineStartBrackets
    description: |
      行頭のカギカッコ類は字下げしない
      例: ^　「こんにちは」 → 「こんにちは」
      例: ^　『こんにちは』 → 『こんにちは』
    pattern:
      source: ^[\\t 　]*[「『]"
      flags: gm
    transform:
      type: text
      steps:
        - action: replace
          from: ^[\\t 　]*
          to: ""

description: 基本的な文章構造に関するパターン（引用符、段落など）
basePriority: 100
patterns:
  - name: lineStartDoubleQuotes
    description: |
      行頭の句点付き二重引用符を処理(句点があれば削除)
      例: ^"こんにちは。" → 　「こんにちは」
      例: ^"こんにちは" → 　「こんにちは」
    pattern:
      source: ^(["”])([^"”。]+)。?}\\1
      flags: "gm"
    transform:
      type: text
      steps:
        - action: processGroup
          group: 2
        - action: replace
          from: [\"”]
          to: ""
        - action: wrap
          prefix: "　「"
          suffix: "」"

  - name: lineStartSingleQuotes
    description: |
      行頭の句点付き一重引用符を処理(句点があれば削除)
      例: ^'こんにちは。' → 　『こんにちは』
      例: ^'こんにちは' → 　『こんにちは』
    pattern:
      source: ^(['’])([^'’。]+)。?\\1
      flags: "gm"
    transform:
      type: text
      steps:
        - action: processGroup
          group: 2
        - action: replace
          from: 。?['’]
          to: ""
        - action: wrap
          prefix: "　『"
          suffix: "』"

  - name: lineStartSingleBracket
    description: |
      行頭のカギカッコを処理(句点があれば削除)
      例: ^「こんにちは。」 → 　「こんにちは」
      例: ^「こんにちは」 → 　「こんにちは」
    pattern:
      source: ^「([^」。]+)。?」
      flags: "gm"
    transform:
      type: text
      steps:
        - action: processGroup
          group: 1
        - action: replace
          from: "。」"
          to: "」"
        - action: wrap
          prefix: "　"

  - name: lineStartDoubleBracket
    description: |
      行頭の二重カギカッコを処理(句点があれば削除)
      例: ^『こんにちは。』 → 　『こんにちは』
      例: ^『こんにちは』 → 　『こんにちは』
    pattern:
      source: "^『([^』。]+)。?』"
      flags: "gm"
    transform:
      type: text
      steps:
        - action: processGroup
          group: 1
        - action: replace
          from: "。』"
          to: "』"
        - action: wrap
          prefix: "　"
          suffix: ""

  - name: periodsBeforeClosingBrackets
    description: |
      閉じカギカッコ直前の句点を削除
      例: こんにちは。」 → こんにちは」
      例: さようなら。』 → さようなら』
    pattern:
      source: 。([」』])
    transform:
      type: text
      steps:
        - action: replace
          from: "。([」』])"
          to: "$1"

  - name: lineStartBrackets
    description: |
      行頭のカギカッコ類に二分アキを挿入
      例: ^「こんにちは」 → 　「こんにちは」
      例: ^『こんにちは』 → 　『こんにちは』
    pattern:
      source: "^([「『])"
      flags: "gm"
    transform:
      type: text
      steps:
        - action: wrap
          prefix: "　"

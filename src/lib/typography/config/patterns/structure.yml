  - name: periodsBeforeClosingBrackets
    description: |
      閉じカギカッコ直前の句点を削除
      例: こんにちは。」 → こんにちは」
      例: さようなら。』 → さようなら』
    pattern:
      source: 。([」』])
    transform:
      type: text
      steps:
        - action: replace
          from: "。([」』])"
          to: "$1"

  - name: lineStartBrackets
    description: |
      行頭のカギカッコ類は字下げしない
      例: ^　「こんにちは」 → 「こんにちは」
      例: ^　『こんにちは』 → 『こんにちは』
    pattern:
      source: "^[\\t 　]*([「『])"
      flags: "gm"
    transform:
      type: text
      steps:
        - action: replace
          from: "^[\\t 　]*"
          to: ""

  - name: lineStartIndent
    description: |
      行頭字下げ
      例: ^こんにちは → 　こんにちは
    pattern:
      source: "^[\\t 　]*"
      flags: "gm"
    transform:
      type: text
      steps:
        - action: replace
          from: "^[\\t 　]*"
          to: "　"

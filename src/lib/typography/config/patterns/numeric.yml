---
description: 数値関連のパターン
basePriority: 100
patterns:
  - name: threeOrMoreDigits
    description: 3桁以上の数字を漢数字に変換
    pattern:
      source: |-
        (?<![\w０-９,，])([\d０-９]{1,3}([,，][\d０-９]{3})+|[\d０-９]{3,})(?![\w０-９,，])
    transform:
      type: text
      steps:
        - action: convertKanji
        - action: replace
          from: |-
            [,，]
          to: 、

  - name: singleDigit
    description: 1桁の数字を全角に変換
    pattern:
      source: |-
        (?<![\d０-９])[\d０-９](?![\d０-９])
    transform:
      type: text
      steps:
        - action: convertWidth
          target: numbers
          direction: fullWidth

  - name: twoDigits
    description: 2桁の数字を半角縦中横に変換
    pattern:
      source: |-
        (?<![\d０-９])[\d０-９]{2}(?![\d０-９])
    transform:
      type: tcy
      steps:
        - action: convertWidth
          target: numbers
          direction: halfWidth

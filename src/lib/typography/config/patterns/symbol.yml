description: 記号に関するパターン
basePriority: 300
patterns:
  - name: doubleExclamationQuestion
    description: 2連続の感嘆符・疑問符を縦中横に変換し、spanタグを閉じたあとに全角スペースがあることを保証する。
    pattern:
      source: "[!?！？]{2}"
      lookbehind: "(?<![!?！？])"
      lookahead: "(?![!?！？])"
    transform:
      type: tcy
      ensureSpace:
        after: true
      steps:
        - action: convertWidth
          target: symbols
          direction: halfwidth

  - name: otherExclamationQuestion
    description: 他の感嘆符・疑問符を全角化して、最後に全角スペース
    pattern:
      source: "[!?！？]+"
      lookbehind: "(?<![!?！？])"
      lookahead: "(?![!?！？])"
    transform:
      type: text
      ensureSpace:
        after: true
      steps:
        - action: convertWidth
          target: symbols
          direction: fullwidth

  - name: multipleDots
    description: 連続中黒(3以上)を三点リーダー(2連)に変換
    pattern:
      source: "[・]{3,}"
    transform:
      type: text
      steps:
        - action: replace
          from: "[・]+"
          to: "……"

  - name: dotsNormalization
    description: 三点リーダーの正規化(常に2連)
    pattern:
      source: "[…]+"
    transform:
      type: text
      steps:
        - action: replace
          from: "[…]+"
          to: "……"

  - name: dashNormalization
    description: ダッシュの正規化(2連以上のゆらぎ文字) → u2500(罫線素片)の2連
    pattern:
      source: "[−—―─ー]{2,}"
    transform:
      type: text
      steps:
        - action: replace
          from: "[−—―─ー]{2,}"
          to: "──"

  - name: basicSymbols
    description: 基本的な記号を全角に変換
    pattern:
      source: "[#$%&*+\\-/=@\\\\^_`{|}~:;<>()\\[\\]]"
    transform:
      type: text
      steps:
        - action: convertWidth
          target: symbols
          direction: fullwidth
